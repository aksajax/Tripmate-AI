
[alembic]
# Migration scripts are stored inside backend/migrations.
script_location = %(here)s/migrations

# Make the backend directory importable during migration execution.
prepend_sys_path = %(here)s

# Use the operating system's path separator for migration paths.
path_separator = os

# The application will provide the real URL through its settings.
sqlalchemy.url =

# Keep generated migration filenames readable and sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
